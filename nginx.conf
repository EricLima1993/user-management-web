server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # rotas do Angular (/users, /users/7/details...) não existem como arquivo:
    # quando não achar o arquivo, devolve o index.html e o Angular decide a tela
    location / {
        try_files $uri $uri/ /index.html;
    }

    # os arquivos .js e .css têm hash no nome, então podem ficar guardados no navegador
    location ~* \.(?:js|css|ico|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # o index.html nunca fica em cache, para o navegador pegar sempre a versão nova
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
